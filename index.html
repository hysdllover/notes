<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="노트">
<meta name="theme-color" content="#ffffff">
<title>노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#fff;--panel:#fff;--ink:#3b3b3b;--sub:#9a968f;--line:#e6e3dd;--soft:#efede8;
--blue:#5f7c9c;--blue-l:#e4eaf1;--hl-y:#f2e8c4;--hl-b:#dae3ee;--hl-p:#eedcdb;--hl-g:#dee8db;
--f:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:300 13.5px/1.7 var(--f);letter-spacing:-.01em;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
input,select{outline:none}
.sp{flex:1}
#app{display:flex;height:100dvh;overflow:hidden}

/* sidebar */
aside{width:272px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:var(--st) 0 var(--sb) var(--sl)}
.sh{display:flex;align-items:center;gap:2px;padding:14px 12px 8px 16px}
.logo{font-weight:500;font-size:13px;letter-spacing:.02em}
.ib{width:30px;height:30px;border-radius:7px;color:var(--sub);font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.ib:active,.ib:hover{background:var(--soft);color:var(--ink)}
.search{margin:0 12px 8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px;transform:scale(.84);transform-origin:left center;width:calc((100% - 24px)/.84)}
#list{flex:1;overflow:auto;padding:2px 8px 12px;-webkit-overflow-scrolling:touch}
.uh{display:flex;align-items:center;gap:2px;padding:6px 0 2px}
.ut{flex:1;text-align:left;font-weight:500;font-size:12.5px;display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:6px}
.car{width:10px;color:var(--sub);font-size:11px}
.cnt{color:var(--sub);font-size:11px;margin-right:2px}
.uh .ib{width:26px;height:26px;font-size:13px}
.ni{display:block;width:100%;text-align:left;padding:5px 8px 5px 22px;border-radius:7px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni:hover{background:var(--soft)}
.ni.on{background:var(--blue-l);color:var(--blue);font-weight:400}
.ni .s{color:var(--blue);font-size:10px;margin-right:4px}
.hint{color:var(--sub);font-size:12px;padding:10px}
.sf{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px}
.sf button{color:var(--blue)}
.sync{margin-left:auto;color:var(--sub);font-size:11px;cursor:pointer}
.sync.err{color:#b27a76}
#scrim{display:none}

/* main */
main{flex:1;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:var(--st) var(--sr) calc(var(--sb) + 40px) 0}
.mh{display:flex;align-items:center;gap:6px;padding:12px 20px 4px}
.menu-b{display:none}
.crumb{font-size:11.5px;color:var(--sub)}
.tbtn{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;white-space:nowrap}
.tbtn:active{background:var(--soft)}
.tbtn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.tbtn.danger{color:#b27a76}
.empty{color:var(--sub);text-align:center;padding:22vh 20px;font-size:13px;line-height:2}
#editor{max-width:820px;margin:0 auto;padding:0 20px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ed-top{padding:8px 0 6px}
#unitSel{border:0;background:transparent;font-size:16px;transform:scale(.75);transform-origin:left center;color:var(--sub);margin-right:-20px}
#unitSel{-webkit-appearance:none;appearance:none;max-width:200px}
#title{display:block;width:100%;border:0;background:transparent;font-size:20px;font-weight:400;padding:6px 0 4px;margin-top:2px}
#title::placeholder{color:#c6c2bb}
#star{color:#d6d3cd;font-size:14px;padding:0 4px}
#star.on{color:var(--blue)}

/* toolbar */
.tbwrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
#tb,#tbt{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tb::-webkit-scrollbar,#tbt::-webkit-scrollbar{display:none}
#tb button,#tbt button{flex:none;min-width:30px;height:30px;padding:0 7px;border-radius:7px;font-size:13px;color:#555}
#tb button:active,#tb button.act{background:var(--soft)}
#tbt{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
#tbt button{font-size:11.5px;border:1px solid var(--line);background:#fff;height:26px}
.sep{flex:none;width:1px;height:16px;background:var(--line);margin:0 4px}
.sw{width:18px!important;min-width:18px!important;height:18px!important;padding:0!important;border-radius:50%!important;margin:0 3px;border:1px solid rgba(0,0,0,.06)!important}
.sw-y{background:var(--hl-y)!important}.sw-b{background:var(--hl-b)!important}.sw-p{background:var(--hl-p)!important}.sw-g{background:var(--hl-g)!important}
.sw-n{background:#fff!important;position:relative}.sw-n::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:1px;background:#c9a3a0;transform:rotate(-45deg)}
.cb{color:var(--blue)!important;font-weight:500}
#pal{margin-top:6px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px}
#palTabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;border-bottom:1px solid var(--soft)}
#palTabs::-webkit-scrollbar{display:none}
#palTabs button{flex:none;font-size:11.5px;padding:3px 9px;border-radius:6px;color:var(--sub)}
#palTabs button.on{background:var(--blue-l);color:var(--blue)}
#palGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:2px;max-height:168px;overflow:auto;padding-top:4px}
#palGrid button{height:34px;border-radius:6px;font-size:15px;font-family:var(--f),"Apple Symbols","Hiragino Mincho ProN",serif}
#palGrid button.w{grid-column:span 2;font-size:13px}
#palGrid button:active{background:var(--blue-l)}
.pe{grid-column:1/-1;color:var(--sub);font-size:11.5px;padding:8px}

/* body */
#secs{padding:10px 0}
.rt{min-height:60dvh;overflow-x:auto;outline:none;font-size:13.8px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
.rt:empty::before{content:attr(data-ph);color:#cbc7c0}
.rt b,.rt strong,.doc b,.doc strong{font-weight:600}
.rt ul,.rt ol{margin:2px 0;padding-left:22px}
.rt p,.rt div{margin:0}
.rt table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95em;line-height:1.6}
.rt td,.rt th{border:1px solid #d9d6cf;padding:6px 10px;vertical-align:top;min-width:84px;font-weight:300;text-align:left}
.rt.rz-c,.rt.rz-c *{cursor:col-resize!important}.rt.rz-r,.rt.rz-r *{cursor:row-resize!important}
.rt table.rzing{outline:1px dashed var(--blue);outline-offset:2px}
.rzh{position:fixed;z-index:20;touch-action:none;-webkit-user-select:none;user-select:none}
.rzh::after{content:"";position:absolute;background:var(--blue);opacity:.45;border-radius:2px}
.rzh::before{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--blue);box-sizing:border-box}
.rzh-c{width:32px;margin-left:-16px;cursor:col-resize}
.rzh-c::after{left:14px;width:4px;top:0;bottom:0}
.rzh-c::before{left:9px;top:calc(50% - 7px)}
.rzh-r{height:32px;margin-top:-16px;cursor:row-resize}
.rzh-r::after{top:14px;height:4px;left:0;right:0}
.rzh-r::before{top:9px;left:calc(50% - 7px)}
.rt table.hd tr:first-child>*,.rt table.hc tr>*:first-child{background:#f1f0ec;font-weight:500}

/* menu / modal */
.menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:4px;min-width:130px}
.menu button{display:block;width:100%;text-align:left;padding:7px 12px;border-radius:7px;font-size:13px}
.menu button:hover{background:var(--soft)}
.menu .danger{color:#b27a76}
.modal{position:fixed;inset:0;z-index:40;background:rgba(60,58,54,.18);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--panel);border-radius:14px;width:100%;max-width:420px;max-height:84dvh;overflow:auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.1)}
.mbox h4{margin:0 0 12px;font-weight:500;font-size:14px}
.fl{display:block;font-size:11px;color:var(--sub);margin:10px 0 3px}
.fi{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px}
.mrow{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;align-items:center}
.note-s{font-size:11px;color:var(--sub);line-height:1.6;margin-top:10px}
.opt{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13px}
.opt input{accent-color:var(--blue)}
.dlg{z-index:60}.dlg .mbox{max-width:340px}.dmsg{font-size:13.5px;line-height:1.7;margin-bottom:10px}.dlg .fi{margin-top:4px}.tbtn.dng{background:#b27a76;border-color:#b27a76;color:#fff}

#print{display:none}

@media (max-width:899px){
  aside{position:fixed;top:0;bottom:0;left:0;width:84vw;max-width:320px;z-index:30;transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 30px rgba(0,0,0,.08)}
  body.side aside{transform:none}
  body.side #scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(60,58,54,.15)}
  .menu-b{display:inline-flex}
  .mh{padding:8px 12px 2px}
  #editor{padding:0 16px}
  #title{font-size:19px}
}
@media print{
  #app,.modal,.menu{display:none!important}
  #print{display:block}
  html,body{background:#fff;height:auto}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="sh"><span class="logo">노트</span><span class="sp"></span>
      <button class="ib" id="bSet" title="설정·동기화">⚙︎</button></div>
    <input id="q" class="search" type="search" placeholder="검색">
    <nav id="list"></nav>
    <div class="sf"><button id="bUnit">＋ 폴더</button><span id="sync" class="sync"></span></div>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <div class="mh"><button class="ib menu-b" id="bMenu">☰</button><span class="crumb" id="crumb"></span><span class="sp"></span><button class="tbtn" id="bExp">내보내기·인쇄</button></div>
    <div id="empty" class="empty">목록에서 노트를 고르거나<br>폴더 옆 ＋ 로 새 노트를 추가하세요.</div>
    <div id="editor" hidden>
      <div class="ed-top">
        <div class="row"><select id="unitSel"></select><button id="star" title="중요">★</button><span class="sp"></span><button class="tbtn danger" id="bDel">삭제</button></div>
        <input id="title" placeholder="제목" autocomplete="off">
      </div>
      <div class="tbwrap" id="tbwrap">
        <div id="tb">
          <button data-c="bold"><b>B</b></button>
          <button data-c="underline"><u>U</u></button>
          <button data-c="strikeThrough"><s>S</s></button>
          <button data-c="blue" class="cb" title="포인트색">A</button>
          <button data-c="ink" title="기본색">A̶</button>
          <span class="sep"></span>
          <button class="sw sw-y" data-hl="--hl-y" title="형광펜"></button>
          <button class="sw sw-b" data-hl="--hl-b" title="형광펜"></button>
          <button class="sw sw-p" data-hl="--hl-p" title="형광펜"></button>
          <button class="sw sw-g" data-hl="--hl-g" title="형광펜"></button>
          <button class="sw sw-n" data-hl="none" title="형광펜 지우기"></button>
          <span class="sep"></span>
          <button data-c="insertUnorderedList">•≡</button>
          <button data-c="insertOrderedList">1≡</button>
          <button data-c="outdent">⇤</button>
          <button data-c="indent">⇥</button>
          <span class="sep"></span>
          <button data-c="table">표</button>
          <button data-c="sym" id="bSym">기호</button>
          <span class="sep"></span>
          <button data-c="removeFormat" title="서식 지우기">T̸</button>
          <button data-c="undo">↶</button>
          <button data-c="redo">↷</button>
        </div>
        <div id="tbt" hidden>
          <button data-t="r+">행 추가</button><button data-t="c+">열 추가</button>
          <button data-t="r-">행 삭제</button><button data-t="c-">열 삭제</button>
          <button data-t="hd">머리행</button><button data-t="hc">머리열</button>
          <button data-t="fit">크기 초기화</button><button data-t="del">표 삭제</button>
        </div>
        <div id="pal" hidden><div id="palTabs"></div><div id="palGrid"></div></div>
      </div>
      <div id="secs"></div>
    </div>
  </main>
</div>
<div id="print"></div>
<div id="hC" class="rzh rzh-c" hidden></div><div id="hR" class="rzh rzh-r" hidden></div>
<div id="modal" class="modal" hidden><div class="mbox" id="mbox"></div></div>

<script>
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=h=>{const d=document.createElement('div');d.innerHTML=h||'';return d.textContent};
const filled=h=>!!(h&&(plain(h).trim()||/<table/i.test(h)));
const LS='syn-db',LSM='syn-meta',LSG='syn-gh';
/* 저장소: 차단된 환경이면 메모리로 대체 */
const MEM={};
const store={
  get(k){try{return localStorage.getItem(k)}catch{return MEM[k]??null}},
  set(k,v){try{localStorage.setItem(k,v)}catch{MEM[k]=v}},
  del(k){try{localStorage.removeItem(k)}catch{delete MEM[k]}}
};
const jget=(k,d)=>{try{return JSON.parse(store.get(k)||'null')||d}catch{return d}};
/* 예전 형식(사상가 + 6칸) → 본문 한 칸으로 변환 */
const OLD=[['core','핵심'],['desc','설명'],['src','원문 · 키워드'],['cmp','비교 · 연관'],['exam','기출 포인트'],['warn','헷갈림 주의']];
function migrate(d){
  d.units??=[];d.notes??=[];let ch=false;
  d.notes.forEach(n=>{if(n.body!==undefined)return;ch=true;
    let b=n.thinker?`<p><b>${esc(n.thinker)}</b></p>`:'';
    OLD.forEach(([k,l])=>{if(filled(n.s?.[k]))b+=`<p><b>${l}</b></p><div>${n.s[k]}</div><p><br></p>`});
    n.body=b;delete n.s;delete n.thinker});
  return ch;
}
let db=jget(LS,{units:[],notes:[]});if(migrate(db))store.set(LS,JSON.stringify(db));
let meta=jget(LSM,{});meta.recent??=[];meta.col??={};
let gh=jget(LSG,{});

/* 앱 내 대화상자 (prompt/confirm/alert 대체) */
function dlg({msg,input,ok='확인',cancel='취소',danger}){
  return new Promise(res=>{
    const w=document.createElement('div');w.className='modal dlg';
    w.innerHTML=`<div class="mbox"><div class="dmsg">${esc(msg).replace(/\n/g,'<br>')}</div>${input!==undefined?`<input class="fi" value="${esc(input)}" autocomplete="off">`:''}
      <div class="mrow"><span class="sp"></span>${cancel?`<button class="tbtn" data-v="0">${cancel}</button>`:''}<button class="tbtn ${danger?'dng':'pri'}" data-v="1">${ok}</button></div></div>`;
    document.body.appendChild(w);
    const inp=w.querySelector('input');
    const done=v=>{w.remove();res(input!==undefined?(v?inp.value:null):v)};
    w.onclick=e=>{const b=e.target.closest('[data-v]');if(b)done(b.dataset.v==='1');else if(e.target===w&&cancel)done(false)};
    if(inp){inp.focus();inp.select();inp.onkeydown=e=>{if(e.key==='Enter')done(true)}}
  });
}
const ask=(msg,v='')=>dlg({msg,input:v});
const yes=(msg,o={})=>dlg({msg,...o});
const say=msg=>dlg({msg,cancel:''});
let cur=meta.cur||null,q='';
const N=()=>db.notes.find(n=>n.id===cur);
const unitName=id=>db.units.find(u=>u.id===id)?.name||'';
const saveMeta=()=>store.set(LSM,JSON.stringify(meta));

/* ---------- 기호 ---------- */
const SYM={
'화살표':'→ ← ↑ ↓ ↔ ↕ ⇒ ⇐ ⇔ ⇑ ⇓ ⇕ ⟶ ⟵ ⟷ ⟹ ⟸ ⟺ ↗ ↘ ↙ ↖ ⇄ ⇆ ⇅ ⇋ ⇌ ↻ ↺ ⟲ ⟳ ↳ ↲ ↱ ↰ ⤴ ⤵ ↪ ↩ ➔ ➜ ➝ ➞ ➙ ↦ ⇢ ⇠ ⇡ ⇣ ↛ ↚ ⇏ ⇍ ⇎ ⊸',
'도형':'○ ● ◎ ◯ ◉ ⊙ ⦿ ◌ ◍ △ ▲ ▽ ▼ ◁ ◀ ▷ ▶ ◃ ▹ ▸ ◂ □ ■ ▢ ▣ ▤ ▥ ▨ ▩ ▪ ▫ ◇ ◆ ◈ ◊ ☆ ★ ✦ ✧ ✩ ✪ ♡ ♥ ♢ ♤ ♧ ◐ ◑ ◒ ◓ ◔ ◕ • ◦ ‣ ⁃ ∙',
'체크·표시':'✓ ✔ ☑ ✅ ✗ ✘ ☒ × ✕ ✖ ⓧ ⓞ ⓥ ※ ☞ ☜ ☝ ☟ ! ? ‼ ⁇ ⁈ ⁉ ✎ ✐ ✏ ✒ ⚑ ⚐ ⚠ ✱ ✲ ✳ ✴ ✵ ✻ ❖ ❋ ✿ ❀ ♪ ♬ ♯ ♭ ☀ ☁ ☾ ⌘ ⌂ ⏎ ¤',
'로마자':'Ⅰ Ⅱ Ⅲ Ⅳ Ⅴ Ⅵ Ⅶ Ⅷ Ⅸ Ⅹ Ⅺ Ⅻ ⅰ ⅱ ⅲ ⅳ ⅴ ⅵ ⅶ ⅷ ⅸ ⅹ ⅺ ⅻ',
'원·괄호 번호':'① ② ③ ④ ⑤ ⑥ ⑦ ⑧ ⑨ ⑩ ⑪ ⑫ ⑬ ⑭ ⑮ ⑯ ⑰ ⑱ ⑲ ⑳ ❶ ❷ ❸ ❹ ❺ ❻ ❼ ❽ ❾ ❿ ⑴ ⑵ ⑶ ⑷ ⑸ ⑹ ⑺ ⑻ ⑼ ⑽ ⒈ ⒉ ⒊ ⒋ ⒌ ⒍ ⒎ ⒏ ⒐ ⒑',
'한글·영문 번호':'㉠ ㉡ ㉢ ㉣ ㉤ ㉥ ㉦ ㉧ ㉨ ㉩ ㉪ ㉫ ㉬ ㉭ ㉮ ㉯ ㉰ ㉱ ㉲ ㉳ ㉴ ㉵ ㉶ ㉷ ㉸ ㉹ ㉺ ㉻ ㈀ ㈁ ㈂ ㈃ ㈄ ㈅ ㈆ ㈎ ㈏ ㈐ ㈑ ㈒ ㈓ ㈔ ⓐ ⓑ ⓒ ⓓ ⓔ ⓕ ⓖ ⓗ Ⓐ Ⓑ Ⓒ Ⓓ Ⓔ Ⓕ Ⓖ Ⓗ ⒜ ⒝ ⒞ ⒟ ⒠ ⒡ 甲 乙 丙 丁 戊',

function cell(){const s=getSelection();if(!s.rangeCount)return null;let n=s.anchorNode;n=n&&(n.nodeType===1?n:n.parentElement);const c=n?.closest?.('td,th');return c&&activeRt?.contains(c)?c:null}

  const tr=c.parentElement,tb=tr.closest('table'),ci=c.cellIndex,rows=[...tb.rows],op=b.dataset.t;
  const blank=tag=>{const t=document.createElement(tag);t.innerHTML='<br>';return t};
  if(op==='r+'){const n=document.createElement('tr');[...tr.cells].forEach(x=>n.appendChild(blank(x.tagName)));tr.after(n)}

/* 표 크기 조절: 칸 오른쪽 경계 드래그 → 열 너비, 아래 경계 드래그 → 행 높이 */
let rz=null;
function edgeAt(t,x,y){
  const c=t?.closest?.('.rt td,.rt th');if(!c)return null;
  const r=c.getBoundingClientRect(),z=6;
  if(Math.abs(x-r.right)<=z)return{c,k:'c'};
  if(Math.abs(y-r.bottom)<=z)return{c,k:'r'};
  return null;
}
function rzStart(hit,x,y){
  const c=hit.c,tb=c.closest('table'),tr=c.parentElement,scale=c.getBoundingClientRect().width/c.offsetWidth||1;
  if(hit.k==='c'){
    const n=Math.max(...[...tb.rows].map(r=>r.cells.length));
    let cg=tb.querySelector('colgroup');
    if(!cg||cg.children.length!==n){
      const w=[...tb.rows[0].cells].map(x=>x.offsetWidth);
      cg?.remove();cg=document.createElement('colgroup');
      for(let i=0;i<n;i++){const col=document.createElement('col');col.style.width=(w[i]||80)+'px';cg.appendChild(col)}
      tb.prepend(cg);tb.style.tableLayout='fixed';
    }
    const col=cg.children[c.cellIndex];
    rz={k:'c',tb,col,cg,x,w:parseFloat(col.style.width),scale};
    sumW(rz);
  }else rz={k:'r',tb,tr,y,h:tr.offsetHeight,scale};
  activeRt=tb.closest('.rt');tb.classList.add('rzing');
}
const sumW=o=>o.tb.style.width=[...o.cg.children].reduce((a,c)=>a+parseFloat(c.style.width),0)+'px';
function rzMove(x,y){
  if(rz.k==='c'){rz.col.style.width=Math.max(48,Math.round(rz.w+(x-rz.x)/rz.scale))+'px';sumW(rz)}
  else rz.tr.style.height=Math.max(24,Math.round(rz.h+(y-rz.y)/rz.scale))+'px';
}
function rzEnd(){if(!rz)return;rz.tb.classList.remove('rzing');rz=null;fire()}
const secs=$('#secs');
secs.addEventListener('pointermove',e=>{
  if(rz){if(e.pointerType==='mouse')rzMove(e.clientX,e.clientY);return}
  if(e.pointerType!=='mouse')return;const h=edgeAt(e.target,e.clientX,e.clientY),rt=e.target.closest?.('.rt');
  rt?.classList.toggle('rz-c',h?.k==='c');rt?.classList.toggle('rz-r',h?.k==='r');
});
secs.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse')return;const h=edgeAt(e.target,e.clientX,e.clientY);if(!h)return;
  e.preventDefault();rzStart(h,e.clientX,e.clientY);
});
document.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'&&rz&&!hC.hasPointerCapture?.(e.pointerId)&&!hR.hasPointerCapture?.(e.pointerId))rzEnd()});
/* 터치·펜슬: 칸을 누르면 오른쪽(열)·아래(행) 손잡이 표시 → 끌어서 조절 */
const hC=$('#hC'),hR=$('#hR');
function placeH(){
  const c=hCell;if(!c||!document.contains(c)||$('#editor').hidden){hC.hidden=hR.hidden=true;return}
  const r=c.getBoundingClientRect(),top=Math.max(r.top,$('#tbwrap').getBoundingClientRect().bottom),bot=Math.min(r.bottom,innerHeight);
  hC.hidden=bot-top<8;hC.style.left=r.right+'px';hC.style.top=top+'px';hC.style.height=(bot-top)+'px';
  hR.hidden=r.bottom<top||r.bottom>innerHeight;hR.style.left=r.left+'px';hR.style.top=r.bottom+'px';hR.style.width=r.width+'px';
}
[[hC,'c'],[hR,'r']].forEach(([h,k])=>{
  h.addEventListener('mousedown',e=>e.preventDefault());
  h.addEventListener('pointerdown',e=>{if(!hCell)return;e.preventDefault();h.setPointerCapture(e.pointerId);rzStart({c:hCell,k},e.clientX,e.clientY)});
  h.addEventListener('pointermove',e=>{if(rz){rzMove(e.clientX,e.clientY);placeH()}});
  const end=()=>{rzEnd();placeH()};h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
});
document.addEventListener('scroll',placeH,true);addEventListener('resize',placeH);
secs.addEventListener('input',()=>requestAnimationFrame(placeH));

const b64e=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function ghGet(){
  const r=await fetch(api()+`?ref=${encodeURIComponent(gh.branch||'main')}&_=${Date.now()}`,{headers:H(),cache:'no-store'});
  if(r.status===404)return null;if(!r.ok)throw new Error('불러오기 실패 ('+r.status+')');
  const j=await r.json();let c=j.content;
  if(!c){const br=await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/git/blobs/${j.sha}`,{headers:H(),cache:'no-store'});c=(await br.json()).content}
  return{sha:j.sha,data:JSON.parse(b64d(c))};
}
async function ghPut(){
  const body={message:'노트 저장 '+new Date().toLocaleString('ko-KR'),content:b64e(JSON.stringify(db)),branch:gh.branch||'main'};
  if(meta.sha)body.sha=meta.sha;
  const r=await fetch(api(),{method:'PUT',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return'conflict';
  if(!r.ok)throw new Error('업로드 실패 ('+r.status+')');
  const j=await r.json();meta.sha=j.content.sha;meta.dirty=false;meta.at=Date.now();saveMeta();
}
function applyRemote(rem){
  db=rem.data;migrate(db);store.set(LS,JSON.stringify(db));
  meta.sha=rem.sha;meta.dirty=false;meta.at=Date.now();saveMeta();
  if(!N())cur=null;renderList();renderEditor();
}
let syncing=false,syncErr='',pushT;
async function sync(retry=true){
  if(!ghOK()||syncing)return;syncing=true;syncErr='';renderStatus('동기화 중…');
  try{
    const rem=await ghGet();
    if(!rem){if((await ghPut())==='conflict')throw new Error('충돌')}
    else if(rem.sha===meta.sha){if(meta.dirty&&(await ghPut())==='conflict'&&retry){syncing=false;return sync(false)}}
    else if(!meta.dirty||!db.notes.length)applyRemote(rem);
    else if(await yes('다른 기기에서 바뀐 내용이 있습니다.',{ok:'GitHub 내용 불러오기',cancel:'이 기기 내용으로 덮어쓰기'}))applyRemote(rem);
    else{meta.sha=rem.sha;if((await ghPut())==='conflict')throw new Error('충돌')}
  }catch(e){syncErr=e.message||'오류'}
  finally{syncing=false;renderStatus()}
}
function schedulePush(){if(!ghOK())return;clearTimeout(pushT);pushT=setTimeout(sync,8000)}
function renderStatus(t){
  const el=$('#sync');el.classList.toggle('err',!!syncErr&&!t);
  if(t)return el.textContent=t;
  if(!ghOK())return el.textContent='기기에 저장됨';
  if(syncErr)return el.textContent='⚠︎ '+syncErr;
  if(meta.dirty)return el.textContent='변경사항 대기';
  el.textContent=meta.at?'동기화 '+new Date(meta.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}):'';
}
$('#sync').onclick=()=>ghOK()?sync():$('#bSet').click();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync();else if(meta.dirty){clearTimeout(pushT);sync()}});

$('#bSet').onclick=()=>{
  modal(`<h4>설정 · GitHub 동기화</h4>
    <label class="fl">Personal access token</label><input class="fi" id="gT" type="password" value="${esc(gh.token||'')}" autocomplete="off">
    <label class="fl">소유자 (아이디)</label><input class="fi" id="gO" value="${esc(gh.owner||'')}" autocapitalize="off">
    <label class="fl">저장소</label><input class="fi" id="gR" value="${esc(gh.repo||'')}" autocapitalize="off">
    <label class="fl">브랜치</label><input class="fi" id="gB" value="${esc(gh.branch||'main')}" autocapitalize="off">
    <label class="fl">파일 경로</label><input class="fi" id="gP" value="${esc(gh.path||'notes.json')}" autocapitalize="off">
    <div class="note-s">Fine-grained: 해당 저장소만 · Contents 읽기/쓰기<br>Classic: <b>repo</b> 권한 체크<br>토큰은 이 기기에만 저장됩니다. 두 기기 모두 같은 값으로 설정하세요.</div>
    <div class="mrow"><button class="tbtn pri" id="gS">저장 후 동기화</button><button class="tbtn" id="gX">연결 해제</button></div>
    <label class="fl" style="margin-top:18px">백업</label>
    <div class="mrow" style="margin-top:4px"><button class="tbtn" id="jE">JSON 백업 저장</button><button class="tbtn" id="jI">JSON 불러오기</button><span class="sp"></span><button class="tbtn" data-x>닫기</button></div>
    <input type="file" id="jF" accept=".json,application/json" hidden>`);
  $('#gS').onclick=()=>{gh={token:$('#gT').value.trim(),owner:$('#gO').value.trim(),repo:$('#gR').value.trim(),branch:$('#gB').value.trim()||'main',path:$('#gP').value.trim()||'notes.json'};
    store.set(LSG,JSON.stringify(gh));meta.sha=null;saveMeta();closeModal();sync()};
  $('#gX').onclick=async()=>{if(!await yes('동기화 연결을 해제할까요? (노트는 유지)'))return;gh={};store.del(LSG);meta.sha=null;saveMeta();closeModal();renderStatus()};
  $('#jE').onclick=()=>download('notes-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,1),'application/json');
  $('#jI').onclick=()=>$('#jF').click();
  $('#jF').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.units)||!Array.isArray(d.notes))throw 0;migrate(d);
    if(!await yes('현재 노트를 백업 내용으로 바꿀까요?'))return;db=d;cur=null;persist();renderList();renderEditor();closeModal()}catch{say('올바른 백업 파일이 아닙니다.')}};
};

/* ---------- 기타 ---------- */
$('#bMenu').onclick=()=>document.body.classList.add('side');
$('#scrim').onclick=()=>document.body.classList.remove('side');
if(!N())cur=null;
renderList();renderEditor();renderStatus();
if(ghOK())sync();
/* ---------- 앱 업데이트: 새 버전이 올라오면 자동 새로고침 ---------- */
let swReg=null,appTag=null;
const hadSW=!!navigator.serviceWorker?.controller;
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>swReg=r).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW)reloadApp()});
}
const pageTag=()=>fetch('index.html?_='+Date.now(),{method:'HEAD',cache:'no-store'}).then(r=>r.ok?(r.headers.get('etag')||r.headers.get('last-modified')):null).catch(()=>null);
function reloadApp(){if(meta.dirty||pt){clearTimeout(pt);persist()}location.reload()}
pageTag().then(t=>appTag=t);
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible')return;
  swReg?.update().catch(()=>{});
  const t=await pageTag();if(t&&appTag&&t!==appTag)reloadApp();else if(t)appTag=t;
});
</script>
